let W,H,X,Y;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);X=W/2;Y=H*.42}

const spr=document.createElement('canvas');spr.width=spr.height=64;
{const c=spr.getContext('2d'),g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.4,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64)}
const TINT=['#ffffff','#cfd8ff','#ffd6e8','#fff1c9'];
const PT=[];
function reset(p,init){
  p.x=Math.random()*W*1.4-W*.2;p.y=init?Math.random()*H:-20-Math.random()*H*.3;
  p.t=Math.random()<.62?0:(Math.random()<.55?1:2);       // 0 patak, 1 kislap, 2 bokeh
  p.z=.3+Math.random()*1.1;p.c=TINT[Math.random()*TINT.length|0];p.ph=Math.random()*6.28;
}
for(let i=0;i<260;i++){const p={};reset(p,true);PT.push(p)}
let T=0,boost=0;
function star(x,y,r){cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function frame(){
  T+=1;boost*=.95;
  cx.globalCompositeOperation='source-over';
  cx.clearRect(0,0,W,H);
  // malabong liwanag sa gitna
  const g=cx.createRadialGradient(X,Y,0,X,Y,Math.max(W,H)*.6);
  g.addColorStop(0,'rgba(70,80,130,.28)');g.addColorStop(.5,'rgba(25,25,50,.12)');g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  const w=.0011+boost*.0007;                                   // bilis ng pag-ikot ng buong ulan
  const cs=Math.cos(w),sn=Math.sin(w);
  for(const p of PT){
    const ox=p.x,oy=p.y;
    let dx=p.x-X,dy=p.y-Y;
    p.x=X+dx*cs-dy*sn*1;p.y=Y+dx*sn+dy*cs;         // paikot
    p.y+=(1.2+p.z*3.2)*(p.t===2?.35:1)*(1+boost*.25);            // ulan pababa
    p.x+=Math.sin(T*.01+p.ph)*.25;
    if(p.y>H+40||p.x<-W*.4||p.x>W*1.4)reset(p,false);
    const al=.25+p.z*.4;
    if(p.t===0){
      cx.strokeStyle=p.c;cx.globalAlpha=al*.8;cx.lineWidth=.6+p.z*.7;
      cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-(p.x-ox)*5,p.y-(p.y-oy)*5);cx.stroke();
    }else if(p.t===1){
      cx.fillStyle=p.c;cx.globalAlpha=al*(.4+.6*Math.abs(Math.sin(T*.03+p.ph)));
      star(p.x,p.y,2+p.z*4);
    }else{
      cx.globalAlpha=.1+p.z*.12;const r=14+p.z*30;cx.drawImage(spr,p.x-r,p.y-r,r*2,r*2);
    }
  }
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}

  const j=await r.json();ASSIGN=j.map||{};applyAssign(ASSIGN);fillSlots(String(body.slot));paint();
}
async function amAct(fn,ok){amsg.textContent='Saving...';try{await fn();amsg.textContent=ok}catch(e){amsg.textContent=e.message||'May error.'}}
$$('aas').onclick=()=>{const id=aid.value.trim();if(!/^\d{15,25}$/.test(id)){amsg.textContent='Discord ID dapat numero lang (17–19 digits).';return}
  amAct(()=>postMem({group:ag.value,slot:+asl.value,id,role:arl.value.trim()}),'Na-assign na!')};
$$('arm').onclick=()=>amAct(()=>postMem({group:ag.value,slot:+asl.value,id:''}),'Natanggal na sa slot.');
$$('acl').onclick=()=>am.classList.remove('on');
am.addEventListener('click',e=>{if(e.target===am)am.classList.remove('on')});
document.addEventListener('click',e=>{if(e.target.closest('.adm')&&ADMIN)openAm()});
</script>
